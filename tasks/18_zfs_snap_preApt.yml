- name: Setup the snapPrepApt script
  ansible.builtin.template:
    src: snapPrepApt.j2
    dest: /usr/local/sbin/snapPrepApt
    owner: root
    group: root
    mode: "0755"

- name: Setup the snapPrepApt script
  ansible.builtin.blockinfile:
    path: /etc/apt/apt.conf.d/00snapPrepApt
    block: |
      // Takes a snapshot of the system before package changes.
      DPkg::Pre-Invoke {"[ -x /usr/local/sbin/snapPrepApt ] && /usr/local/sbin/snapPrepApt || true";};
    create: true
    mode: "0644"
    marker: // {mark} ANSIBLE MANAGED BLOCK

