# ##[ Install Packages Need to get Started ]####################################
- name: Install Packages Need to get Started on Ubuntu
  when: ansible_distribution == "Ubuntu"
  tags:
    - install-zfs-packages
  block:
    - name: Install ZFS packages (assumes Live CD Environment)
      ansible.builtin.apt:
        name: ['debootstrap', 'gdisk', 'zfs-initramfs', 'dosfstools', 'mdadm']
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Stop ZED Service
      ansible.builtin.systemd:
        name: zed
        enabled: true
        state: stopped

###############################################################################
- name: Install Packages Need to get Started on Debian
  when: ansible_distribution == "Debian"
  tags:
    - install-zfs-packages
  block:
    - name: Remove default debian source list
      ansible.builtin.file:
        name: /etc/apt/sources.list.d/debian.sources
        state: absent

    - name: Clear Live ISO sources.list
      ansible.builtin.copy:
        dest: /etc/apt/sources.list
        content: "# Use the /etc/apt/sources.list.d/"
        owner: root
        group: root
        mode: '0644'

    - name: Add contrib non-free-firmware repositories into sources list
      ansible.builtin.apt_repository:
        repo: deb http://deb.debian.org/debian/ {{ item.dists }} main contrib non-free-firmware
        state: present
        filename: debian-contrib
        update_cache: "{{ item.update_cache }}"
      loop:
        - {dists: "{{ ansible_distribution_release }}", update_cache: false}
        - {dists: "{{ ansible_distribution_release }}-updates", update_cache: true}

    - name: Install ZFS dep packages (assumes Live CD Environment) Debian
      ansible.builtin.apt:
        name: ['debootstrap', 'gdisk', 'dkms', "linux-headers-{{ ansible_kernel }}"]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Install ZFS packages (assumes Live CD Environment)
      ansible.builtin.apt:
        name: zfsutils-linux
        state: present
      environment:
        DEBIAN_FRONTEND: noninteractive

        # TODO check SB enable, because the module doesn't work with it enabled
        # https://askubuntu.com/questions/1455528/modprobe-key-was-rejected-by-service-ubuntu-22-04-1-desktop-iso#1463702
    - name: Debian | enabling zfs module
      community.general.modprobe:
        name: zfs
        state: present

    - name: Stop ZED Service
      ansible.builtin.systemd:
        name: zed
        enabled: true
        state: stopped

###############################################################################
